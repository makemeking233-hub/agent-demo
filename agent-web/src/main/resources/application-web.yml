# agent-web profile 配置 (openspec add-web-ui-v0-1)
# 激活方式: -Dspring.profiles.active=web
# 与 CLI profile 共存于同一个 Spring 上下文 (复用 agent-core 的 AgentLoop /
# SessionStore / PermissionManager / ToolRegistry bean)
#
# 开发: mvn -pl agent-web spring-boot:run -Dspring-boot.run.profiles=web
# 生产: mvn -pl agent-web clean package && java -jar agent-web/target/agent-web.jar

server:
  # HTTP 端口; agent.web.port 跟这个对齐 (v0.1 不支持 port override)
  port: 18080

# 关键: base application.yml 的 spring.main.web-application-type=none (CLI 不需要内嵌 server)。
# web profile 必须覆盖为 reactive, 否则 Spring 不起 HTTP server, WebApplication 启动后立刻退出
# (banner 打印后无 Netty started, 进程退出码 0)。WebApplication.main() 的 setWebApplicationType(REACTIVE)
# 会被配置文件覆盖, 因此必须在 profile 配置文件里显式声明。
spring:
  main:
    web-application-type: reactive

agent:
  web:
    # 绑定的网卡 IP. 默认 loopback (单用户本地).
    # 显式设为具体 LAN IP (如 192.168.1.42) 暴露到 LAN, 触发 TrustedHostFilter 检查.
    # 0.0.0.0 在启动时直接拒 (WebConfig.validateHost), 避免误暴露公网.
    host: 127.0.0.1
    # HTTP 端口; 与 server.port 对齐
    port: 18080
    # 允许的远端 IP (CIDR 或单 IP). 空列表 = 仅 loopback 接受.
    # 例:
    #   -Dagent.web.trusted-hosts=192.168.1.0/24   (整个 /24 子网)
    #   -Dagent.web.trusted-hosts=192.168.1.42     (单 IP)
    trusted-hosts: []
  # add-provider-catalog-abstract: provider/model 分层目录（对齐 dsh web ModelProviderGroup）。
  # 每个 provider 含其 models[],每个 model 含 supportsReasoning + reasoningEfforts[] 数组。
  # ProviderCatalogService 启动校验 supportsReasoning=false 时 reasoning-efforts 必须为空。
  # 旧 key supported-models 兼容：通过 System property -Dagent.chat.supported-models=... 兜底（task 3.3）。
  chat:
    providers:
      - id: deepseek
        name: DeepSeek
        models:
          - id: deepseek-v4-flash
            name: DeepSeek-V4-Flash
            supports-reasoning: false
            reasoning-efforts: []
          - id: deepseek-reasoner
            name: DeepSeek Reasoner
            supports-reasoning: true
            reasoning-efforts:
              - { id: low,    name: Low }
              - { id: medium, name: Medium }
              - { id: high,   name: High }
          - id: deepseek-v4-pro
            name: DeepSeek-V4-Pro
            supports-reasoning: true
            reasoning-efforts:
              - { id: low,    name: Low }
              - { id: medium, name: Medium }
              - { id: high,   name: High }
    default-provider: deepseek
    default-model: deepseek-v4-flash
  # auto-archive-stale-sessions: 超期会话自动归档
  session:
    auto-archive:
      # 开关；false 时启动与定时都不做任何归档
      enabled: true
      # 保留期（天）：最后活动时间早于此值的会话被自动归档（按文件 mtime 判定）
      after-days: 7
      # 调度间隔（毫秒），默认 6 小时；启动后先执行一次，之后按此间隔重复
      interval-ms: 21600000
  # improve-voice-accuracy T8.3: ASR 后处理开关
  # true: 前端 useVoiceChat 调 /api/chat/voice-correction（DeepSeek 语义纠错）；启动时校验 DeepSeek key
  # false: 跳过纠错端点，仅用 dedupeRepeats 本地去重；启动时不要求 DeepSeek key
  voice:
    post-process:
      enabled: true
