# Secret 扫描 (gitleaks)
# 触发: push 到 main + 所有 PR
# 设计原则:
#   - 失败快速: secret-scan 不依赖 build, 单独跑
#   - 在 ci.yml 之前跑, 避免 secrets 混入后还要重跑 build
#   - 默认 gitleaks-action@v2 自带 SARIF 上传到 Security tab, 便于审计
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # SARIF 上传需要 (默认 token 已有此权限, 显式声明更稳)
  security-events: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整 fetch 历史, gitleaks 需要 diff 算法
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # GitHub 自动注入 GITHUB_TOKEN, action 用于 SARIF 上传
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自定义配置路径 (项目根 .gitleaks.toml)
          GITLEAKS_CONFIG: .gitleaks.toml
          # 锁定 gitleaks 版本, 避免上游更新改变扫描行为
          GITLEAKS_VERSION: 8.30.1
          # 上传 SARIF 报告到 GitHub Security tab
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true