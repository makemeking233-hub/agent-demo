name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # 显式固定 Node 版本 (与 agent-web/pom.xml frontend-maven-plugin 配置一致: v20.11.0);
      # 缓存 ~/.npm 让 agent-web 的 npm ci 不每次重下 248 packages, 避免 7s 早期失败 (超时/网络抖动).
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
          cache-dependency-path: 'agent-web/frontend/package-lock.json'
      - name: Validate lockfile
        run: node -e "const l=require('./agent-web/frontend/package-lock.json'); console.log('lockfileVersion=' + l.lockfileVersion + ', packages=' + Object.keys(l.packages).length);"
      - name: Build
        run: mvn -B -ntp clean package -DskipTests
      - name: Test
        run: mvn -B -ntp test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports