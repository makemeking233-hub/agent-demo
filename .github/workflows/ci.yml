name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # 显式固定 Node 版本 (与 agent-web/pom.xml frontend-maven-plugin 配置一致: v20.11.0).
      # 注: 不要用 setup-node 内置 cache='npm' (与 cache-dependency-path 组合会触发
      # "Some specified paths were not resolved"), 改用独立的 actions/cache@v4.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
      - name: Cache npm registry (~/.npm)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('agent-web/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Validate lockfile
        run: node -e "const l=require('./agent-web/frontend/package-lock.json'); console.log('lockfileVersion=' + l.lockfileVersion + ', packages=' + Object.keys(l.packages).length);"
      - name: Build
        run: mvn -B -ntp clean package -DskipTests
      - name: Test
        run: mvn -B -ntp test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports